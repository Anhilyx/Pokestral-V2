<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />   <stop offset="100%" stop-color="#0055FF" /> </linearGradient>
   
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1"/>
      <feOffset dx="0.5" dy="0.5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="scale(0.8)" transform-origin="0 0">
    <circle cx="50" cy="50" r="45" fill="#FFFFFF"/>
    <path d="M 5 50 A 45 45 0 0 1 95 50 Z" fill="#EE1515"/>
    <line x1="5" y1="50" x2="95" y2="50" stroke="#222222" stroke-width="6" stroke-linecap="butt" />
    <circle cx="50" cy="50" r="45" fill="none" stroke="#222222" stroke-width="6"/>
    <circle cx="50" cy="50" r="12" fill="#FFFFFF" stroke="#222222" stroke-width="5"/>
    <circle cx="50" cy="50" r="7" fill="none" stroke="#222222" stroke-width="1" opacity="0.2"/>
  </g>

  <g transform="translate(30, 30) scale(0.7)">
    <path d="M 50 0 C 55 33 67 45 100 50 C 67 55 55 67 50 100 C 45 67 33 55 0 50 C 33 45 45 33 50 0 Z"
          fill="url(#cyanBlueGradient)"
          filter="url(#dropShadow)" />
  </g>
</svg>